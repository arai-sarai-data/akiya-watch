<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>放置空き家ウォッチ 2023 ｜ 都道府県別の空き家率</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>:root{--bg:#f6f5f1;--card:#fff;--ink:#1b1b19;--sub:#5f5d56;--line:#e3e0d7;--acc:#4338ca;--lo:#e0e3fb;--good:#2f6f4f}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--card:#1f1e1b;--ink:#efede7;--sub:#aaa79e;--line:#35332e;--lo:#25263a}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Noto Sans SC","Noto Sans KR",system-ui,sans-serif;line-height:1.7;overflow-wrap:anywhere}
body.lang-zh{font-family:"Noto Sans SC","Noto Sans JP",system-ui,sans-serif}
body.lang-ko{font-family:"Noto Sans KR","Noto Sans JP",system-ui,sans-serif;word-break:keep-all}
.wrap{max-width:1100px;margin:auto;padding:0 18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0 0;flex-wrap:wrap}
.kicker{font-size:13px;letter-spacing:.08em;color:var(--acc);font-weight:700}
.langs{display:flex;gap:4px;flex-wrap:wrap}
.langs a{font-size:13px;text-decoration:none;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:3px 11px}
.langs a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
header{padding:22px 0 18px}
h1{font-size:clamp(28px,5.2vw,48px);line-height:1.2;margin:.15em 0 .25em;font-weight:900;letter-spacing:-.01em}
.hook{font-size:clamp(18px,2.6vw,24px);font-weight:700;line-height:1.5;margin:.4em 0 .6em;padding-left:14px;border-left:6px solid var(--acc)}
.lead{color:var(--sub);max-width:780px;font-size:15.5px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px;margin:6px 0 22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-size:clamp(24px,3.4vw,30px);font-variant-numeric:tabular-nums;line-height:1.25;font-weight:900;color:var(--acc)}
.kpi span{font-size:13px;color:var(--sub)}
section.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px}
h2{font-size:20px;margin:0 0 12px;line-height:1.4}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.tabs button,.btn,select{font:inherit;font-size:14px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer;min-height:36px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
select{border-radius:10px;max-width:100%}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media (max-width:780px){.grid2{grid-template-columns:minmax(0,1fr)}}
.map{container-type:inline-size;display:grid;grid-template-columns:repeat(13,minmax(0,1fr));grid-template-rows:repeat(14,minmax(0,1fr));gap:3px;aspect-ratio:13/14;width:100%;max-width:470px}
.tile{border-radius:4px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;color:#fff;font-weight:700;text-shadow:0 0 3px rgba(0,0,0,.45);overflow:hidden;line-height:1.05;padding:0 1px;word-break:break-all;font-size:12px}
.tile.sel{outline:3px solid var(--ink);outline-offset:1px;z-index:1}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin-top:10px}
.legend i{display:block;height:10px;width:140px;border-radius:5px;background:linear-gradient(90deg,var(--lo),var(--acc))}
.tops{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 16px}
@media (max-width:520px){.tops{grid-template-columns:1fr}}
.tops div{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tops h3{font-size:13px;margin:0 0 4px;color:var(--sub)}
.tops ol{margin:0;padding-left:1.4em;font-size:14px}
.tops li span{float:right;font-variant-numeric:tabular-nums;font-weight:700}
.bars{max-height:560px;overflow:auto;padding-right:4px}
.bar{display:grid;grid-template-columns:26px minmax(64px,96px) minmax(40px,1fr) 74px;align-items:center;gap:6px;font-size:13px;padding:2px 2px;cursor:pointer}
.bar .t{height:14px;background:var(--line);border-radius:3px;position:relative}
.bar .t div{height:100%;background:var(--acc);border-radius:3px}
.bar .nat{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.bar.sel{background:color-mix(in srgb,var(--acc) 15%,transparent);border-radius:4px;font-weight:700}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk{color:var(--sub);text-align:right}
.note{font-size:13px;color:var(--sub)}
.mine{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:780px){.mine{grid-template-columns:minmax(0,1fr)}}
.badge{border-radius:16px;padding:18px;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#000));color:#fff}
.badge .pn{font-size:15px;opacity:.9}
.badge .big{font-size:clamp(34px,6vw,52px);font-weight:900;line-height:1.1;margin:4px 0}
.badge .lab{font-size:14px;opacity:.95}
.badge .shr{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.badge a,.badge button{font:inherit;font-size:13px;color:#fff;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);border-radius:999px;padding:6px 14px;text-decoration:none;cursor:pointer}
.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px;margin-top:12px}
.detail div{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.detail b{font-size:20px;display:block;font-variant-numeric:tabular-nums}
.detail small{color:var(--sub);display:block;line-height:1.4}
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.insights div{border-left:4px solid var(--acc);padding:8px 12px;background:color-mix(in srgb,var(--acc) 7%,transparent);border-radius:0 10px 10px 0;font-size:14.5px}
.quiz .opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.quiz .opts button{font:inherit;font-size:15px;border:2px solid var(--line);background:transparent;color:var(--ink);padding:8px 18px;border-radius:12px;cursor:pointer}
.quiz .opts button.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,transparent)}
.quiz .opts button.ng{border-color:#b42318;opacity:.7}
.quiz .ans{font-size:14.5px;min-height:1.5em}
.regs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:780px){.regs{grid-template-columns:1fr}}
.regs h3{font-size:14px;margin:0 0 6px}
.rg{display:grid;grid-template-columns:minmax(0,1fr) 90px 52px;gap:6px;align-items:center;font-size:13px;padding:2px 0}
.rg .t{height:12px;background:var(--line);border-radius:3px}
.rg .t div{height:100%;background:var(--acc);border-radius:3px}
.rg .v{text-align:right;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
th{cursor:pointer;color:var(--sub);font-weight:600;position:sticky;top:0;background:var(--card);z-index:1}
th:first-child{z-index:2}
.tablewrap{max-height:520px;overflow:auto}
.note li{margin-bottom:4px}
a{color:var(--acc)}
footer{padding:4px 0 40px;font-size:12px;color:var(--sub)}

化", "share": "空房中闲置比例", "per": "每几套1套"}, "say": "{name}的住房中{v:r23}为空房（第{r:r23}名）。其中用途未定的空房占住房总数的{v:o23}（第{r:o23}名，5年变化{v:do}），约每{v:per}套中有1套。", "share": "【日本空房2023】{name}在“{label}”中位列47个都道府县第{cr}名（{cv}）。鹿儿岛约每7套住房就有1套无用途空房。你的县呢？", "quiz": {"q": "“用途未定空房”比例最高的都道府县是？", "opts": [29, 38, 45, 4], "ans": 45, "exp": "鹿儿岛县13.6%，其次是高知县12.9%、德岛县和爱媛县12.2%。和歌山县为12.0%，秋田县为10.0%。"}, "insights": ["闲置空房率前10名中<b>8个位于中国·四国·九州地区</b>。居首的鹿儿岛（13.6%）约每7套住房就有1套。", "5年间增幅最大的是<b>爱媛（+2.0个百分点）</b>，其次是德岛（+1.9）、青森（+1.6）。共有39个都道府县上升。", "山梨和长野的空房率约20%，但闲置空房率在8%左右。差距主要来自别墅等二次住宅以及出租·出售用空房。", "东京的闲置空房率为2.6%，为全国最低水平。但由于住房总数多，绝对数量并不少。"], "notes": ["数值为《住宅·土地统计调查》（2023年10月1日）住房数概数（速报）结果，可能与确定值略有不同。", "该调查为抽样调查（全国约340万户），人口较少的县存在误差。", "“闲置空房”是本网站的称呼，统计上为“出租·出售用及二次住宅以外的空房”（包括长期不在和计划拆除的住房等）。", "“空房中闲置的比例”“每几套1套”由本网站计算。"]}, "ko": {"title": "방치 빈집 워치 2023 | 일본 도도부현별 빈집률", "kicker": "공공 데이터 사이트 03 | 주거·방재", "h1": "‘쓸 곳 없는 빈집’은 어디서 늘고 있을까?", "hook": "가고시마에서는 주택 약 7채 중 1채가 임대도 매각도 예정 없는 빈집입니다.", "lead": "일본 총무성 ‘주택·토지 통계조사’(2023년)를 바탕으로 빈집률과, 임대·매각용이나 별장을 제외한 ‘용도가 정해지지 않은 빈집’(이 사이트에서는 방치 빈집이라고 부릅니다)의 비율을 비교합니다. 붕괴·방범·경관 위험으로 이어지기 쉬운 것은 후자입니다.", "kpis": [["900만 호", "전국 빈집 수(역대 최다)"], ["13.8%", "전국 빈집률(역대 최고)"], ["13.6%", "방치 빈집률 최고: 가고시마현"], ["39곳", "5년간 방치 빈집률이 오른 도도부현"]], "m": {"o23": {"label": "방치 빈집률(2023)", "desc": "전체 주택 중 ‘임대·매각용 및 2차 주택을 제외한 빈집’의 비율. 전국 5.9%.", "rank": "높은 순"}, "r23": {"label": "빈집률(2023)", "desc": "전체 주택 중 빈집의 비율. 전국 13.8%로 역대 최고.", "rank": "높은 순"}, "do": {"label": "방치 빈집률 5년 변화", "desc": "2018년→2023년 변화. 전국 +0.3%p.", "rank": "증가 순"}, "share": {"label": "빈집 중 방치 비율", "desc": "전체 빈집 중 방치 빈집의 비율(이 사이트 계산).", "rank": "높은 순"}}, "tc": {"r23": "빈집률 2023", "r18": "빈집률 2018", "dr": "변화", "o23": "방치율 2023", "o18": "방치율 2018", "do": "변화", "share": "빈집 중 방치 비율", "per": "몇 채 중 1채"}, "say": "{name}은(는) 주택의 {v:r23}가 빈집({r:r23}위)입니다. 그중 용도가 정해지지 않은 빈집은 전체 주택의 {v:o23}({r:o23}위, 5년간 {v:do})로 약 {v:per}채 중 1채입니다.", "share": "[일본 빈집 2023] {name}은(는) ‘{label}’에서 47개 도도부현 중 {cr}위({cv}). 가고시마는 주택 약 7채 중 1채가 쓸
